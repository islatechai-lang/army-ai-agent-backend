services:
  - type: web
    name: whop-agent-army
    env: python
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: UNOROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
